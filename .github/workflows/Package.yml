name: Package

on:
  pull_request:
    branches: [Exploration, Dev]
  push:
    branches: [Dev, Prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build distribution packages
      run: |
        PYTHON_BIN="${pythonLocation:+$pythonLocation/bin/python}"
        PYTHON_BIN="${PYTHON_BIN:-python}"
        "$PYTHON_BIN" -m pip install --upgrade pip build
        "$PYTHON_BIN" -m build build --sdist --wheel --outdir build/dist

  Publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Dev' || github.ref == 'refs/heads/Prod')
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build distribution packages
      run: |
        PYTHON_BIN="${pythonLocation:+$pythonLocation/bin/python}"
        PYTHON_BIN="${PYTHON_BIN:-python}"
        "$PYTHON_BIN" -m pip install --upgrade pip build
        "$PYTHON_BIN" -m build build --sdist --wheel --outdir build/dist
    - if: github.ref == 'refs/heads/Dev'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        packages-dir: build/dist
        repository-url: https://test.pypi.org/legacy
        attestations: false
    - if: github.ref == 'refs/heads/Prod'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        packages-dir: build/dist
