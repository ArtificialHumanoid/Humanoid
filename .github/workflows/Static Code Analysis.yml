on: push

env:
  FILES: captcha_solver tests

defaults:
  run:
    shell: bash
    working-directory: ./build

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.11']
    steps:

    - uses: qoomon/actions--access-token@v3
      id: access-token
      with:
        repository: ArtificialHumanoid/Utilities
        permissions: |
          contents: read

    - uses: actions/checkout@v4

    - name: Install Dependencies
      env:
        GITHUB_TOKEN: ${{ steps.access-token.outputs.token }}
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        curl https://bootstrap.pypa.io/get-pip.py | python3
        pip install -U -r requirements_dev.txt
        pip install -U -e .

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python }}

    - name: Run tests
      run: |
        # pylint -j0 $(FILES)
        # flake8 -j auto --max-cognitive-complexity=17 $(FILES)
        # bandit -qc pyproject.toml -r $(FILES)
        mypy --strict ../src
